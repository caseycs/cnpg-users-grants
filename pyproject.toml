[project]
name = "cnpg-users-grants"
version = "0.1.0"
description = "Keep CloudNativePG users and grants in YAML, and see what drifted"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml", "pygments", "kubernetes", "boto3"]

[project.scripts]
cnpg-users = "cnpg_users.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnpg_users"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
